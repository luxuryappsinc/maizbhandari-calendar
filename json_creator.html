<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maizbhandari Calendar - Event JSON Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #007c29;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d5d9dd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #007c29;
      box-shadow: 0 0 0 3px rgba(0, 124, 41, 0.1);
    }

    input:disabled,
    select:disabled {
      background: #eef0f2;
      color: #888;
      cursor: not-allowed;
      opacity: 0.7;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 30px;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
    }

    .checkbox label {
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary {
      background: #007c29;
      color: white;
    }

    .primary:hover {
      background: #006b23;
    }

    .secondary {
      background: #e9ecef;
      color: #222;
    }

    .blue {
      background: #1769aa;
      color: white;
    }

    .danger {
      background: #dc3545;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
    }

    .success {
      display: block;
      background: #e8f7ed;
      color: #176b32;
    }

    .error {
      display: block;
      background: #fdecec;
      color: #a11a1a;
    }

    .loading {
      display: block;
      background: #fff6dc;
      color: #765b00;
    }

    .event-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .event-item {
      border: 1px solid #e2e5e8;
      border-radius: 12px;
      padding: 15px;
      background: #fafafa;
    }

    .event-title {
      font-weight: 700;
      font-size: 16px;
    }

    .event-meta {
      color: #666;
      font-size: 13px;
      margin-top: 5px;
    }

    .json-container {
      position: relative;
    }

    pre {
      margin: 0;
      background: #111827;
      color: #e5e7eb;
      padding: 20px;
      border-radius: 12px;
      overflow: auto;
      max-height: 600px;
      font-size: 13px;
      line-height: 1.6;
    }

    .json-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .count {
      color: #666;
      font-size: 14px;
      margin-bottom: 15px;
    }

    @media (max-width: 700px) {
      .container {
        margin: 15px auto;
        padding: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .checkbox {
        padding-top: 0;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="card">

    <h1>Maizbhandari Calendar</h1>

    <p>Event JSON Generator</p>

    <div id="status" class="status"></div>

  </div>


  <!-- EXISTING EVENTS -->
  <div class="card">

    <h2>Existing Events</h2>

    <div id="eventCount" class="count">
      Loading events...
    </div>

    <div id="existingEvents" class="event-list">
    </div>

  </div>


  <!-- ADD EVENT -->
  <div class="card">

    <h2>Add New Event</h2>

    <form id="eventForm">

      <div class="grid">

        <!-- TITLE -->
        <div>

          <label for="title">
            Title
          </label>

          <input
            type="text"
            id="title"
            placeholder="Event title"
            required
          >

        </div>


        <!-- TYPE -->
        <div>

          <label for="type">
            Type
          </label>

          <select id="type">

            <option value="urs">
              Urs Sharif
            </option>

            <option value="khoshroz">
              Khoshroz Sharif
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <!-- DESCRIPTION -->
        <div class="full">

          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Event description"
          ></textarea>

        </div>


        <!-- DATE -->
        <div>

          <label for="date">
            Date
          </label>

          <input
            type="date"
            id="date"
            required
          >

        </div>


        <!-- LOCATION -->
        <div>

          <label for="location">
            Location
          </label>

          <input
            type="text"
            id="location"
            placeholder="Event location"
          >

        </div>


        <!-- FROM -->
        <div>

          <label for="from">
            From
          </label>

          <input
            type="date"
            id="from"
          >

        </div>


        <!-- TO -->
        <div>

          <label for="to">
            To
          </label>

          <input
            type="date"
            id="to"
          >

        </div>


        <!-- REPEAT -->
        <div>

          <label for="repeat">
            Repeat
          </label>

          <select id="repeat">

            <option value="none">
              None
            </option>

            <option value="daily">
              Daily
            </option>

            <option value="weekly">
              Weekly
            </option>

            <option value="monthly">
              Monthly
            </option>

            <option value="yearly">
              Yearly
            </option>

          </select>

        </div>


        <!-- REMINDER -->
        <div>

          <label for="reminder">
            Reminder
          </label>

          <select id="reminder">

            <option value="None">
              None
            </option>

            <option value="5m">
              5 minutes
            </option>

            <option value="15m">
              15 minutes
            </option>

            <option value="30m">
              30 minutes
            </option>

            <option value="1h">
              1 hour
            </option>

            <option value="1d">
              1 day
            </option>

          </select>

        </div>


        <!-- ALL DAY -->
        <div class="checkbox">

          <input
            type="checkbox"
            id="allDay"
          >

          <label for="allDay">
            All Day Event
          </label>

        </div>

      </div>


      <!-- ACTIONS -->
      <div class="actions">

        <button
          type="submit"
          class="primary"
        >
          Add Event & Generate JSON
        </button>

        <button
          type="button"
          class="secondary"
          onclick="resetForm()"
        >
          Clear
        </button>

      </div>

    </form>

  </div>


  <!-- GENERATED JSON -->
  <div class="card">

    <h2>Updated JSON</h2>

    <div class="json-container">

      <pre id="jsonOutput">[]</pre>

    </div>

    <div class="json-actions">

      <button
        class="blue"
        onclick="copyJSON()"
        id="copyButton"
        disabled
      >
        Copy JSON
      </button>

      <button
        class="primary"
        onclick="downloadJSON()"
        id="downloadButton"
        disabled
      >
        Download JSON
      </button>

    </div>

  </div>

</div>


<script>

const JSON_URL =
  "https://maizbhandari-calendar.pages.dev/urosh/event.json";


let events = [];


// --------------------------------------------------
// STATUS
// --------------------------------------------------

function showStatus(message, type) {

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className =
    "status " + type;

}


// --------------------------------------------------
// LOAD EXISTING JSON
// --------------------------------------------------

async function loadEvents() {

  showStatus(
    "Loading existing event data...",
    "loading"
  );

  try {

    const response =
      await fetch(
        JSON_URL,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP error: " +
        response.status
      );

    }

    const data =
      await response.json();

    if (!Array.isArray(data)) {

      throw new Error(
        "JSON must contain an array of events."
      );

    }

    events = data;

    displayExistingEvents();

    updateJSON();

    showStatus(
      "Existing events loaded successfully.",
      "success"
    );

  }

  catch (error) {

    console.error(error);

    showStatus(
      "Could not load event.json: " +
      error.message,
      "error"
    );

    events = [];

    displayExistingEvents();

    updateJSON();

  }

}


// --------------------------------------------------
// DISPLAY EXISTING EVENTS
// --------------------------------------------------

function displayExistingEvents() {

  const container =
    document.getElementById(
      "existingEvents"
    );

  const count =
    document.getElementById(
      "eventCount"
    );


  count.textContent =
    events.length +
    (
      events.length === 1
        ? " event"
        : " events"
    );


  container.innerHTML = "";


  if (events.length === 0) {

    container.innerHTML =
      "<div class='event-item'>" +
      "No events found." +
      "</div>";

    return;

  }


  events.forEach((event) => {

    const item =
      document.createElement("div");

    item.className =
      "event-item";


    const title =
      document.createElement("div");

    title.className =
      "event-title";

    title.textContent =
      event.title ||
      "Untitled Event";


    const meta =
      document.createElement("div");

    meta.className =
      "event-meta";

    meta.textContent =
      "ID: " +
      (event.id ?? "") +
      " • " +
      (event.date ?? "");


    item.appendChild(title);

    item.appendChild(meta);

    container.appendChild(item);

  });

}


// --------------------------------------------------
// GENERATE NEXT ID
// --------------------------------------------------

function generateNextId() {

  const numericIds =
    events

      .map(
        event => Number(event.id)
      )

      .filter(
        id => Number.isFinite(id)
      );


  if (numericIds.length === 0) {

    return "1";

  }


  const maxId =
    Math.max(...numericIds);


  return String(
    maxId + 1
  );

}


// --------------------------------------------------
// DATE -> MIDNIGHT ISO
// --------------------------------------------------

function toMidnightISO(value) {

  if (!value) {

    throw new Error(
      "Invalid date."
    );

  }


  /*
    Always create:

    YYYY-MM-DDT00:00:00.000Z
  */

  return value +
    "T00:00:00.000Z";

}


// --------------------------------------------------
// TYPE -> ENABLE / DISABLE FROM & TO
// --------------------------------------------------

function updateDateFields() {

  const type =
    document.getElementById(
      "type"
    ).value;


  const fromInput =
    document.getElementById(
      "from"
    );

  const toInput =
    document.getElementById(
      "to"
    );


  const disableDates =
    type === "urs" ||
    type === "khoshroz";


  fromInput.disabled =
    disableDates;

  toInput.disabled =
    disableDates;


  if (disableDates) {

    fromInput.value = "";

    toInput.value = "";

  }

}


// --------------------------------------------------
// TYPE CHANGE LISTENER
// --------------------------------------------------

document
  .getElementById("type")
  .addEventListener(
    "change",
    updateDateFields
  );


// --------------------------------------------------
// ADD EVENT
// --------------------------------------------------

document
  .getElementById("eventForm")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      try {

        const id =
          generateNextId();


        const title =
          document
            .getElementById("title")
            .value
            .trim();


        const description =
          document
            .getElementById("description")
            .value
            .trim();


        const dateValue =
          document
            .getElementById("date")
            .value;


        const type =
          document
            .getElementById("type")
            .value;


        const location =
          document
            .getElementById("location")
            .value
            .trim();


        const allDay =
          document
            .getElementById("allDay")
            .checked;


        const fromValue =
          document
            .getElementById("from")
            .value;


        const toValue =
          document
            .getElementById("to")
            .value;


        const repeat =
          document
            .getElementById("repeat")
            .value;


        const reminder =
          document
            .getElementById("reminder")
            .value;


        // ------------------------------------------
        // VALIDATION
        // ------------------------------------------

        if (!title) {

          alert(
            "Please enter an event title."
          );

          return;

        }


        if (!dateValue) {

          alert(
            "Please select the event date."
          );

          return;

        }


        /*
          From and To are required only
          when Type = Other.
        */

        if (
          type === "other" &&
          (!fromValue || !toValue)
        ) {

          alert(
            "Please select the start and end dates."
          );

          return;

        }


        // ------------------------------------------
        // CREATE EVENT
        // ------------------------------------------

        const newEvent = {

          id: id,

          title: title,

          description: description,

          date: toMidnightISO(
            dateValue
          ),

          type: type,

          isBuiltin: true,

          location: location,

          allDay: allDay,

          /*
            Urs / Khoshroz:
            from = ""
            to = ""

            Other:
            actual ISO dates
          */

          from: fromValue
            ? toMidnightISO(
                fromValue
              )
            : "",

          to: toValue
            ? toMidnightISO(
                toValue
              )
            : "",

          repeat: repeat,

          reminder: reminder,

          image: ""

        };


        // ------------------------------------------
        // ADD EVENT
        // ------------------------------------------

        events.push(
          newEvent
        );


        // ------------------------------------------
        // UPDATE UI
        // ------------------------------------------

        displayExistingEvents();

        updateJSON();


        showStatus(
          "Event " +
          id +
          " added successfully.",
          "success"
        );


        // ------------------------------------------
        // SCROLL TO JSON
        // ------------------------------------------

        document
          .getElementById(
            "jsonOutput"
          )
          .scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

      }

      catch (error) {

        console.error(error);

        showStatus(
          error.message,
          "error"
        );

      }

    }
  );


// --------------------------------------------------
// UPDATE JSON DISPLAY
// --------------------------------------------------

function updateJSON() {

  const output =
    document.getElementById(
      "jsonOutput"
    );


  output.textContent =
    JSON.stringify(
      events,
      null,
      2
    );


  const hasData =
    events.length > 0;


  document
    .getElementById(
      "copyButton"
    )
    .disabled =
      !hasData;


  document
    .getElementById(
      "downloadButton"
    )
    .disabled =
      !hasData;

}


// --------------------------------------------------
// COPY JSON
// --------------------------------------------------

async function copyJSON() {

  const json =
    JSON.stringify(
      events,
      null,
      2
    );


  try {

    await navigator
      .clipboard
      .writeText(
        json
      );


    showStatus(
      "JSON copied to clipboard.",
      "success"
    );


    const button =
      document.getElementById(
        "copyButton"
      );


    const original =
      button.textContent;


    button.textContent =
      "Copied!";


    setTimeout(() => {

      button.textContent =
        original;

    }, 1500);

  }

  catch (error) {

    console.error(error);

    showStatus(
      "Could not copy JSON.",
      "error"
    );

  }

}


// --------------------------------------------------
// DOWNLOAD JSON
// --------------------------------------------------

function downloadJSON() {

  const json =
    JSON.stringify(
      events,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;

  link.download =
    "event.json";


  document
    .body
    .appendChild(
      link
    );

  link.click();

  document
    .body
    .removeChild(
      link
    );


  URL.revokeObjectURL(
    url
  );


  showStatus(
    "event.json downloaded successfully.",
    "success"
  );

}


// --------------------------------------------------
// RESET FORM
// --------------------------------------------------

function resetForm() {

  document
    .getElementById(
      "eventForm"
    )
    .reset();


  /*
    Re-apply the correct
    From / To disabled state.
  */

  updateDateFields();

}


// --------------------------------------------------
// INITIAL DATE FIELD STATE
// --------------------------------------------------

updateDateFields();


// --------------------------------------------------
// INITIAL LOAD
// --------------------------------------------------

loadEvents();

</script>

</body>
</html>
